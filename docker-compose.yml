services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: phalcon-app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: phalcon-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app